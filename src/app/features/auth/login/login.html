<div class="login-page">
  <div class="login-shell">
    <section class="login-visual" aria-label="Ambiente del restaurante">
      <div class="login-visual-content">
        <p>Restaurante Casa Lola</p>
        <h1>CRM-operativo para optimizar </h1>
        <span>la gestión de pedidos, clientes, reservas, fidelización y toma de decisiones de un restaurante en un solo panel.</span>
      </div>
    </section>

    <section class="login-card">
      <div class="mb-8">
        <!-- <div class="grid h-12 w-12 place-items-center rounded-lg bg-slate-950 text-lg font-bold text-white">R</div> -->
        <h2 class="mt-5 text-2xl font-semibold tracking-tight">Iniciar sesion</h2>
        <p class="mt-2 text-sm text-slate-500">Ingresa con tus credenciales del sistema.</p>
      </div>

      <form class="grid gap-4" (ngSubmit)="iniciarSesion()">
        <label class="text-sm font-medium text-slate-700">
          Gmail
          <input
            class="input"
            type="email"
            name="correo"
            [(ngModel)]="correo"
            placeholder="usuario@restaurante.com"
            required
          />
        </label>

        <label class="text-sm font-medium text-slate-700">
          Password
          <input
            class="input"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="********"
            required
          />
        </label>

        @if (error) {
          <div class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</div>
        }

        <button class="btn btn-primary mt-2 w-full" type="submit">Ingresar</button>
      </form>
    </section>
  </div>
</div>
