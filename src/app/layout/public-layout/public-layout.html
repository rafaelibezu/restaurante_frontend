<div class="min-h-screen bg-[#f7f4ef] text-slate-900">
  <header class="sticky top-0 z-50 border-b border-white/40 bg-white/85 backdrop-blur-xl">
    <nav class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 sm:py-4">
      <a routerLink="/cliente" class="flex min-w-0 items-center gap-3" (click)="cerrarMenu()">
        <div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-[#d6a84f] text-xl font-black text-white shadow-lg">
          R
        </div>
        <div class="min-w-0">
          <h1 class="truncate text-base font-extrabold tracking-tight text-[#17213f] sm:text-lg">Restaurante Casa LoLa</h1>
          <p class="text-xs font-medium text-slate-500">Experiencia gastronomica</p>
        </div>
      </a>

      <div class="hidden items-center gap-8 md:flex">
        <a routerLink="/cliente" class="nav-link">Inicio</a>
        <a routerLink="/cliente/promociones" class="nav-link">Promociones</a>
        <a routerLink="/cliente/reservar" class="nav-link">Reservar mesa</a>
        <a routerLink="/login" class="rounded-full bg-[#17213f] px-5 py-2.5 text-sm font-bold text-white shadow-md transition hover:bg-[#243b7a]">
          Panel interno
        </a>
      </div>

      <button class="public-menu-btn md:hidden" type="button" [attr.aria-expanded]="menuAbierto" aria-label="Abrir menu" (click)="alternarMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          @if (!menuAbierto) {
            <path d="M4 6h16" />
            <path d="M4 12h16" />
            <path d="M4 18h16" />
          } @else {
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          }
        </svg>
      </button>
    </nav>

    @if (menuAbierto) {
      <div class="mobile-public-menu md:hidden">
        <a routerLink="/cliente" (click)="cerrarMenu()">Inicio</a>
        <a routerLink="/cliente/promociones" (click)="cerrarMenu()">Promociones</a>
        <a routerLink="/cliente/reservar" (click)="cerrarMenu()">Reservar mesa</a>
        <a routerLink="/login" class="internal-link" (click)="cerrarMenu()">Panel interno</a>
      </div>
    }
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto grid max-w-7xl gap-4 px-4 py-8 text-sm text-slate-500 sm:px-6 md:grid-cols-3">
      <p>2026 Restaurante Casa LoLa</p>
      <p class="md:text-center">Reservas, promociones y atencion personalizada.</p>
      <p class="md:text-right">Lima, Peru</p>
    </div>
  </footer>
</div>
